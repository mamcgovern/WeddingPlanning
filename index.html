  <title>The Bergans' Wedding Party</title>
  <script>
    (() => {
      const currentLocation = window.location;

      if (!currentLocation.search.startsWith("?/")) {
        return;
      }

      const restoredRoute = currentLocation.search
        .slice(1)
        .split("&")
        .map((part) => part.replace(/~and~/g, "&"))
        .join("?");

      window.history.replaceState(
        null,
        "",
        `${restoredRoute}${currentLocation.hash}`
      );
    })();
  </script>
