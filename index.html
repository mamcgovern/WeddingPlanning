  <script>
    (() => {
      const location = window.location;

      if (location.search.startsWith("?/")) {
        const decodedRoute = location.search
          .slice(2)
          .split("&")
          .map((part) => part.replace(/~and~/g, "&"))
          .join("?");

        window.history.replaceState(
          null,
          "",
          `${location.pathname}${decodedRoute}${location.hash}`
        );
      }
    })();
  </script>
